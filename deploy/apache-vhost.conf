# ============================================================================
# Tubtubon eHealth — Apache vhost for Ubuntu 24.04 (PHP 8.3)
# Installed by deploy/bootstrap.sh to:
#   /etc/apache2/sites-available/tubtubon.conf
#
# Replace SERVER_NAME_HERE with either:
#   - the bare Elastic IP (IP-only test pass), e.g. 13.212.44.10
#   - a nip.io hostname for TLS, e.g. 13.212.44.10.nip.io
#   - the final Hostinger domain, e.g. tubtubonehealth.com
# ============================================================================

<VirtualHost *:80>
    ServerName SERVER_NAME_HERE
    ServerAdmin admin@example.com

    # Project root, NOT /public — index.php routes into modules/auth/login.php
    DocumentRoot /var/www/tubtubon_ehealth

    # CRITICAL: index.php MUST come before index.html.
    # Ubuntu's default DirectoryIndex puts index.html first, which would serve
    # the 91 KB static prototype at "/" and bypass the PHP router entirely.
    DirectoryIndex index.php index.html

    <Directory /var/www/tubtubon_ehealth>
        Options -Indexes +FollowSymLinks
        # AllowOverride All is REQUIRED so storage/.htaccess (Require all denied)
        # actually protects patient uploads and DB backup archives.
        AllowOverride All
        Require all granted
    </Directory>

    # Never serve secrets or the git history over HTTP.
    <FilesMatch "^\.(env|git.*|htaccess)$">
        Require all denied
    </FilesMatch>
    <FilesMatch "\.(sql|md|log|ini|bak|dist|example)$">
        Require all denied
    </FilesMatch>

    # Server-side only: no direct URL access to SQL migrations, CLI jobs,
    # library code, or the local manuscript folder.
    <DirectoryMatch "^/var/www/tubtubon_ehealth/(migrations|cli|config|includes|reference files|\.git)">
        Require all denied
    </DirectoryMatch>

    # 5 MB upload cap in the app (FR-12) + headroom for multipart overhead
    LimitRequestBody 10485760

    ErrorLog  ${APACHE_LOG_DIR}/tubtubon_error.log
    CustomLog ${APACHE_LOG_DIR}/tubtubon_access.log combined
</VirtualHost>

# ---------------------------------------------------------------------------
# TLS is added automatically by:
#   sudo certbot --apache -d <hostname>
# Certbot appends the :443 vhost + redirect. Do not hand-write it.
#
# Bare-IP note: Let's Encrypt will NOT issue a certificate for a raw IP.
# Use the free wildcard-DNS trick instead if you want HTTPS before the domain:
#   13.212.44.10  ->  https://13.212.44.10.nip.io
# ---------------------------------------------------------------------------
